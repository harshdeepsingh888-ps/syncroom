<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="SyncRoom is a server-authoritative real-time watch party application."
    />

    <meta
      name="theme-color"
      content="#f4f5f1"
    />

    <title>SyncRoom — Watch Together</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('syncroom_theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
